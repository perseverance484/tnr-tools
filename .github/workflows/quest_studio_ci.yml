name: quest-studio-ci

on:
  workflow_dispatch:
  push:
    paths:
      - "forge/src/github.mjs"
      - "forge/src/studio/**"
      - "forge/src/ui/dom.mjs"
      - "forge/test/github.studio.test.mjs"
      - "forge/test/quest.studio.ui.test.mjs"
      - "forge_bundle.js"
      - "skills/building-tnr-content/scripts/quest_compile.py"
      - "skills/building-tnr-content/scripts/quest_compile_integration_test.py"
      - "skills/building-tnr-content/data/49_DATA_quest_studio_subtypes.json"
      - ".github/workflows/quest_studio.yml"
      - ".github/workflows/quest_studio_ci.yml"
  pull_request:
    paths:
      - "forge/src/github.mjs"
      - "forge/src/studio/**"
      - "forge/src/ui/dom.mjs"
      - "forge/test/github.studio.test.mjs"
      - "forge/test/quest.studio.ui.test.mjs"
      - "forge_bundle.js"
      - "skills/building-tnr-content/scripts/quest_compile.py"
      - "skills/building-tnr-content/scripts/quest_compile_integration_test.py"
      - "skills/building-tnr-content/data/49_DATA_quest_studio_subtypes.json"
      - ".github/workflows/quest_studio.yml"
      - ".github/workflows/quest_studio_ci.yml"

# Verification is intentionally read-only. The one-time bundle sync workflow is not retained.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: forge/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Quest Studio worker/compiler have no live-game network path
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast
          from pathlib import Path

          compiler = Path("skills/building-tnr-content/scripts/quest_compile.py")
          tree = ast.parse(compiler.read_text(encoding="utf-8"), filename=str(compiler))
          forbidden = {"requests", "httpx", "aiohttp", "socket", "http.client", "urllib", "urllib3"}
          imports = set()
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  imports.update(alias.name for alias in node.names)
              elif isinstance(node, ast.ImportFrom) and node.module:
                  imports.add(node.module)
          bad = sorted(name for name in imports if any(name == root or name.startswith(root + ".") for root in forbidden))
          if bad:
              raise SystemExit(f"Quest Studio compiler imports forbidden network modules: {bad}")
          PY

          if grep -nEi 'theninja-rpg\.com|/api/trpc|(^|[^[:alnum:]_])(curl|wget)[[:space:]]' \
            .github/workflows/quest_studio.yml \
            skills/building-tnr-content/scripts/quest_compile.py; then
            echo "Quest Studio worker/compiler contains a live-game or generic shell network path" >&2
            exit 1
          fi

      - name: Quest Studio compiler selftest
        run: python3 skills/building-tnr-content/scripts/quest_compile.py --selftest

      - name: Mission adapter integration test
        run: python3 skills/building-tnr-content/scripts/quest_compile_integration_test.py

      - name: Forge tests and fixtures
        working-directory: forge
        run: |
          npm ci
          npm test
          npm run fixtures
          git diff --exit-code -- test/fixtures/envelope

      - name: Build Forge bundle
        working-directory: forge
        run: npm run build

      - name: Upload generated Forge bundle
        uses: actions/upload-artifact@v4
        with:
          name: quest-studio-forge-bundle
          path: forge_bundle.js
          if-no-files-found: error
          retention-days: 3

      - name: Verify checked Forge bundle
        run: git diff --exit-code -- forge_bundle.js