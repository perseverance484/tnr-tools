name: forge-capture-fix-apply
on:
  push:
    branches: [chatgpt/forge-capture-only-fix]
    paths:
      - ".github/workflows/forge_capture_fix_apply.yml"

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: forge/package-lock.json
      - name: Align capture-only repository verification
        run: python3 .github/scripts/fix_capture_harvest.py
      - name: Install Forge dependencies
        working-directory: forge
        run: npm ci
      - name: Audit runtime dependencies
        working-directory: forge
        run: npm audit --omit=dev --audit-level=high
      - name: Run Forge tests
        working-directory: forge
        run: npm test
      - name: Verify deterministic transport fixtures
        working-directory: forge
        run: |
          npm run fixtures
          git diff --exit-code -- test/fixtures/envelope
      - name: Verify checked Forge bundle remains reproducible
        working-directory: forge
        run: |
          npm run build
          git diff --exit-code -- ../forge_bundle.js
      - name: Commit verified harvest integration
        run: >-
          python3 .github/scripts/commit_generated.py
          "forge: verify capture-only results honestly"
          skills/building-tnr-content/scripts/harvest.py
          forge/test/harvest.test.mjs
