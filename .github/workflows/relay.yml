name: relay
on:
  workflow_dispatch:
    inputs:
      branch:
        description: "relay/* branch to merge into main"
        required: true

permissions:
  contents: write

concurrency:
  group: relay
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge work branch
        env:
          BRANCH: ${{ github.event.inputs.branch }}
        run: |
          case "$BRANCH" in relay/*) ;; *) echo "branch must start with relay/" >&2; exit 1 ;; esac
          git check-ref-format --branch "$BRANCH" >/dev/null
          git config user.name "relay[bot]"
          git config user.email "relay@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin --prune
            git checkout -B relay-merge origin/main
            git merge --no-ff "origin/$BRANCH" -m "relay: merge $BRANCH [auto]"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "main advanced during merge; retrying ($attempt/3)"
          done
          exit 1
