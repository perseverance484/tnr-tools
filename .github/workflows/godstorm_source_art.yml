name: Godstorm source-art archive

on:
  push:
    branches: ['chatgpt/godstorm-source-art-pack']
    paths:
      - 'scripts/godstorm_art/**'
      - '.github/workflows/godstorm_source_art.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: godstorm-source-art-archive
  cancel-in-progress: false

jobs:
  archive:
    if: github.repository == 'perseverance484/tnr-tools' && github.ref == 'refs/heads/chatgpt/godstorm-source-art-pack'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install image decoder
        run: python3 -m pip install --disable-pip-version-check 'Pillow==12.3.0'
      - name: Socket-free collector tests
        run: python3 -m unittest discover -s scripts/godstorm_art -p 'test_*.py' -v
      - name: Fetch only captured image URLs
        run: python3 scripts/godstorm_art/collect_godstorm_art.py --repo-root . --out work/godstorm_source
      - name: Save original files and provenance to this branch only
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          branch='chatgpt/godstorm-source-art-pack'
          archive="art/godstorm_source/archives/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test ! -e "$archive"
          mkdir -p "$(dirname "$archive")"
          cp -a work/godstorm_source "$archive"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$archive"
          git commit -m "art: archive Godstorm source images, run ${GITHUB_RUN_ID}"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" fetch origin "$branch"
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE_SHA"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" pull --rebase origin "$branch"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:$branch"
      - name: Export review archive, including partial-download diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: godstorm-source-art-${{ github.run_id }}
          path: |
            work/godstorm_source.zip
            work/godstorm_source/index.json
          if-no-files-found: warn
          retention-days: 30
