name: bootstrap-restructure
on:
  workflow_dispatch:
    inputs:
      drive_url:
        description: "Google Drive share link to repo_apply.zip"
        required: true
      sha256:
        description: "Expected sha256 (leave as-is)"
        required: true
        default: "f86c9781e50b54d03f8db76d4776a0179b84b2cd3171c5bd80013567b8a53c89"
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the zip from Drive
        env:
          URL: ${{ inputs.drive_url }}
        run: |
          ID=$(echo "$URL" | grep -oE '[-_A-Za-z0-9]{25,}' | head -1)
          test -n "$ID" || { echo "::error::No file id found in the link"; exit 1; }
          curl -sL "https://drive.google.com/uc?export=download&id=${ID}" -o repo_apply.zip
          if file repo_apply.zip | grep -qi html; then
            curl -sL "https://drive.usercontent.google.com/download?id=${ID}&export=download&confirm=t" -o repo_apply.zip
          fi
          ls -la repo_apply.zip
      - name: Verify integrity before touching anything
        env:
          SHA: ${{ inputs.sha256 }}
        run: |
          echo "${SHA}  repo_apply.zip" | sha256sum -c -
      - name: Apply (workflow files excluded; those are pasted by hand)
        run: |
          unzip -p repo_apply.zip DELETIONS.txt > /tmp/del.txt
          unzip -o repo_apply.zip -x DELETIONS.txt ".github/workflows/*"
          while IFS= read -r f; do
            [ -n "$f" ] && git rm -f --ignore-unmatch -- "$f"
          done < /tmp/del.txt
          rm -f repo_apply.zip
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "stage 2: restructure, scrub sweep, answer layer [bootstrap]"
          git push
