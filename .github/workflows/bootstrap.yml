name: bootstrap-restructure
on: workflow_dispatch
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch apply zip from the release
        run: gh release download stage2-apply --pattern repo_apply.zip --repo "$GITHUB_REPOSITORY"
      - name: Apply
        run: |
          unzip -p repo_apply.zip DELETIONS.txt > /tmp/del.txt
          unzip -o repo_apply.zip -x DELETIONS.txt
          while IFS= read -r f; do
            [ -n "$f" ] && git rm -f --ignore-unmatch -- "$f"
          done < /tmp/del.txt
          rm -f repo_apply.zip
          git rm -f --ignore-unmatch .github/workflows/bootstrap.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "stage 2: restructure, scrub, workflows, answer layer [bootstrap]"
          git push
      - name: Delete the release and tag
        run: gh release delete stage2-apply -y --cleanup-tag
