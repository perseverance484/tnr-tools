name: release-pin
on:
  push:
    branches: [main]
    paths:
      - "builder_bundle.js"
      - "forge_bundle.js"

permissions:
  contents: write

concurrency:
  group: release-pin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Pin changed loaders
        run: git diff --name-only HEAD~1 HEAD | python3 .github/scripts/pin_release.py
      - name: Commit pinned loaders
        run: >-
          python3 .github/scripts/commit_generated.py
          "loader: pin changed bundle(s) to $GITHUB_SHA via jsDelivr [auto]"
          builder_loader_user.js
          forge_loader_user.js
