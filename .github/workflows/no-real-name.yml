name: no-real-name
on: [push, pull_request]

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - name: The real first name never appears (D-no-real-name; scripts/check_no_real_name.py)
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          python3 scripts/check_no_real_name.py --selftest
          if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            python3 scripts/check_no_real_name.py --commits "$BEFORE..HEAD"
          else
            python3 scripts/check_no_real_name.py --commits "HEAD~1..HEAD"
          fi
