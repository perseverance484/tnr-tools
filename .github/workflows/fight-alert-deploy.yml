name: fight-alert-deploy
# Deploys tools/fight-alert to the owner's Cloudflare account and sends one test alert.
# Needs repository secrets CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and NTFY_TOPIC.
on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-kinzit]
    paths:
      - "tools/fight-alert/**"
      - ".github/workflows/fight-alert-deploy.yml"

concurrency: fight-alert-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/fight-alert
    env:
      HAS_SECRETS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' && secrets.NTFY_TOPIC != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Secrets present
        run: |
          if [ "$HAS_SECRETS" != "true" ]; then
            echo "::warning::Add CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and NTFY_TOPIC as repository secrets, then re-run."
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - name: Deploy
        id: deploy
        if: env.HAS_SECRETS == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: tools/fight-alert
          secrets: NTFY_TOPIC
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Optional ntfy access token
        if: env.HAS_SECRETS == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: |
          if [ -n "$NTFY_TOKEN" ]; then
            printf '%s' "$NTFY_TOKEN" | npx wrangler secret put NTFY_TOKEN
          else
            echo "No NTFY_TOKEN secret; sending to ntfy.sh anonymously."
          fi
      - name: Wake it and send a test alert
        if: env.HAS_SECRETS == 'true'
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          echo "Worker: $URL"
          sleep 30
          for i in 1 2 3 4 5 6; do
            STATUS=$(curl -fsS "$URL/status" || true)
            echo "$STATUS"
            echo "$STATUS" | grep -q '"connected":true' && break
            sleep 10
          done
          RESULT=$(curl -sS "$URL/test?key=$NTFY_TOPIC")
          echo "Test alert result: $RESULT"
          curl -fsS "$URL/status"
          echo "$RESULT" | grep -q '"ok":true'
