name: forge
on:
  push:
    paths:
      - "forge/**"
      - "forge_bundle.js"
      - "forge_loader_user.js"
      - "skills/building-tnr-content/scripts/harvest.py"
      - ".github/scripts/pin_release.py"
      - ".github/workflows/release_pin.yml"
      - ".github/workflows/forge.yml"
  pull_request:
    paths:
      - "forge/**"
      - "forge_bundle.js"
      - "forge_loader_user.js"
      - "skills/building-tnr-content/scripts/harvest.py"
      - ".github/scripts/pin_release.py"
      - ".github/workflows/release_pin.yml"
      - ".github/workflows/forge.yml"

permissions:
  contents: read

concurrency:
  group: forge-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: forge
    steps:
      # Full history, not the default depth-1. Two guards in the suite read a blob out of the commit
      # that push/53's imagePack NAMES - which is an earlier commit than the one being tested - to
      # prove the committed pack still matches the committed art. A shallow clone does not contain
      # that commit, so those guards would be unable to check the one thing they exist for.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: forge/package-lock.json
      - run: npm ci

      # ---- policy gates ------------------------------------------------------------------------
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Import direction (execution -> core -> ui/hosts, one way)
        run: node tools/check_imports.mjs

      - name: Static boundaries (network confinement, no live game host, contract pin agreement)
        run: node tools/check_boundaries.mjs

      # ---- behaviour ---------------------------------------------------------------------------
      - run: npm test

      # ---- generated artifacts must be reproducible from source --------------------------------
      - name: Verify generated fixtures
        run: |
          npm run fixtures
          git diff --exit-code -- test/fixtures/envelope
          git diff --exit-code -- test/fixtures/screens

      - name: Verify checked bundle
        run: |
          npm run build
          git diff --exit-code -- ../forge_bundle.js

      - name: Bundle size budget (raw and deterministic gzip)
        run: node tools/check_bundle_budget.mjs

      # ---- release pin -------------------------------------------------------------------------
      # The loader's pin/version lifecycle is checked by the suite above (release_loader.test.mjs);
      # this step surfaces the state in the log so a failure is readable without opening a test.
      - name: Report release pin state
        run: node -e "import('./tools/check_release_pin.mjs').then(m=>{const p=m.checkReleasePin();console.log(p.length?JSON.stringify(p,null,1):'release pin clean');process.exit(p.length?1:0)})"
