name: quest-studio-source-push-temp

on:
  push:
    paths:
      - ".github/workflows/quest_studio_source_push_temp.yml"

permissions:
  contents: write

jobs:
  apply-test-build:
    if: github.ref == 'refs/heads/chatgpt/forge-quest-studio-source-push-work'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/forge-quest-studio-source-push-work
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: forge/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Repair temporary patch-script escaping
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("state/quest_studio_source_push_fix.py")
          text = p.read_text(encoding="utf-8")

          replacements = [
            ('    return "\\n".join(out)\n', '    return "\\\\n".join(out)\n'),
            ('        print(f"\\n{len(failures)} contract failures")\n', '        print()\n        print(f"{len(failures)} contract failures")\n'),
            ('    print("\\nQuest Studio source-push trust boundary pinned")\n', '    print()\n    print("Quest Studio source-push trust boundary pinned")\n'),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f"expected one escape repair, found {text.count(old)} for {old!r}")
              text = text.replace(old, new)

          old = '''    require(text, 'branches:\\n      - "studio/quest/**"', "worker is scoped to Studio request branches", failures)\n    require(text, 'paths:\\n      - "studio/requests/*.quest.json"', "worker triggers only on Quest Source writes", failures)\n'''
          new = '''    require(text, 'branches:', "worker declares a branch filter", failures)\n    require(text, '- "studio/quest/**"', "worker is scoped to Studio request branches", failures)\n    require(text, 'paths:', "worker declares a path filter", failures)\n    require(text, '- "studio/requests/*.quest.json"', "worker triggers only on Quest Source writes", failures)\n'''
          if text.count(old) != 1:
              raise SystemExit(f"expected one multiline trigger assertion block, found {text.count(old)}")
          text = text.replace(old, new)
          p.write_text(text, encoding="utf-8")
          PY

      - name: Apply source-push conversion
        run: python3 state/quest_studio_source_push_fix.py

      - name: Verify worker trust boundary
        run: python3 skills/building-tnr-content/scripts/quest_worker_contract_test.py

      - name: Verify compiler and Mission adapter
        run: |
          set -euo pipefail
          python3 skills/building-tnr-content/scripts/quest_compile.py --selftest
          python3 skills/building-tnr-content/scripts/quest_compile_integration_test.py

      - name: Verify Forge and rebuild bundle
        working-directory: forge
        run: |
          set -euo pipefail
          npm ci
          npm test
          npm run fixtures
          git diff --exit-code -- test/fixtures/envelope
          npm run build

      - name: Regenerate skillpacks
        run: python3 .github/scripts/pack_skills.py

      - name: Repository coherence gates
        run: |
          set -euo pipefail
          python3 skills/building-tnr-content/scripts/doctrinemap.py
          python3 skills/building-tnr-content/scripts/render_doctrine.py --check
          python3 skills/building-tnr-content/scripts/build_packs.py --check
          python3 skills/building-tnr-content/scripts/lawmap.py .

      - name: Commit tested non-workflow changes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("docs/RULINGS.md")
          text = p.read_text(encoding="utf-8")
          for prefix in ("**Date:** 2026-09-16", "**Domain:** Forge Next / repository build security", "**Status:** ACTIVE"):
              text = text.replace(prefix + "  \n", prefix + "\n")
          p.write_text(text, encoding="utf-8")
          PY
          git config user.name "quest-studio-source-push[bot]"
          git config user.email "quest-studio-source-push[bot]@users.noreply.github.com"
          git add -- \
            forge/src/github.mjs \
            forge/src/studio/repository.mjs \
            forge/src/ui/screens.mjs \
            forge/test/github.studio.test.mjs \
            forge_bundle.js \
            skills/building-tnr-content/scripts/quest_worker_contract_test.py \
            docs/RULINGS.md \
            docs/design/FORGE_NEXT_REPO_BACKED_STUDIO_ARCHITECTURE.md \
            dist
          git diff --cached --check
          git diff --cached --quiet && { echo "No tested changes staged" >&2; exit 1; }
          git commit -m "fix: use source-push for Quest Studio builds"
          git push origin HEAD:chatgpt/forge-quest-studio-source-push-work
