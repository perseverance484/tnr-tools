name: quest-studio-source-push-temp

on:
  push:
    paths:
      - ".github/workflows/quest_studio_source_push_temp.yml"

permissions:
  contents: write

jobs:
  apply-test-build:
    if: github.ref == 'refs/heads/chatgpt/forge-quest-studio-source-push-work'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/forge-quest-studio-source-push-work
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: forge/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply source-push conversion
        run: python3 state/quest_studio_source_push_fix.py

      - name: Verify worker trust boundary
        run: python3 skills/building-tnr-content/scripts/quest_worker_contract_test.py

      - name: Verify compiler and Mission adapter
        run: |
          set -euo pipefail
          python3 skills/building-tnr-content/scripts/quest_compile.py --selftest
          python3 skills/building-tnr-content/scripts/quest_compile_integration_test.py

      - name: Verify Forge and rebuild bundle
        working-directory: forge
        run: |
          set -euo pipefail
          npm ci
          npm test
          npm run fixtures
          git diff --exit-code -- test/fixtures/envelope
          npm run build

      - name: Regenerate skillpacks
        run: python3 .github/scripts/pack_skills.py

      - name: Repository coherence gates
        run: |
          set -euo pipefail
          python3 skills/building-tnr-content/scripts/doctrinemap.py
          python3 skills/building-tnr-content/scripts/render_doctrine.py --check
          python3 skills/building-tnr-content/scripts/build_packs.py --check
          python3 skills/building-tnr-content/scripts/lawmap.py .

      - name: Commit tested non-workflow changes
        run: |
          set -euo pipefail
          git config user.name "quest-studio-source-push[bot]"
          git config user.email "quest-studio-source-push[bot]@users.noreply.github.com"
          git add -- \
            forge/src/github.mjs \
            forge/src/studio/repository.mjs \
            forge/src/ui/screens.mjs \
            forge/test/github.studio.test.mjs \
            forge_bundle.js \
            skills/building-tnr-content/scripts/quest_worker_contract_test.py \
            docs/RULINGS.md \
            docs/design/FORGE_NEXT_REPO_BACKED_STUDIO_ARCHITECTURE.md \
            dist
          git diff --cached --check
          git diff --cached --quiet && { echo "No tested changes staged" >&2; exit 1; }
          git commit -m "fix: use source-push for Quest Studio builds"
          git push origin HEAD:chatgpt/forge-quest-studio-source-push-work
