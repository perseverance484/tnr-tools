name: contract-reconcile
on:
  push:
    branches:
      - chatgpt/repo-simplification-audit
    paths:
      - ".github/workflows/contract_reconcile.yml"
      - "skills/building-tnr-content/scripts/schema_extract.py"
      - "skills/building-tnr-content/scripts/schema_diff.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch exact pinned game source
        run: |
          set -euo pipefail
          UP_SHA=bdec2883748f029a0ecb93505adfdcbae6851fe9
          curl -fsSL -o /tmp/up.tar.gz "https://codeload.github.com/studie-tech/TheNinjaRPG/tar.gz/$UP_SHA"
          mkdir -p /tmp/up
          tar xzf /tmp/up.tar.gz -C /tmp/up --strip-components=1
          printf '%s\n' "$UP_SHA" > /tmp/upstream-sha.txt

      - name: Regenerate candidate contract family
        run: |
          set -euo pipefail
          S=skills/building-tnr-content/scripts
          LABEL='git:studie-tech/TheNinjaRPG@bdec2883 (2026-08-29)'
          python3 "$S/schema_extract.py" /tmp/up --ctors > /tmp/45c.json
          python3 "$S/schema_extract.py" /tmp/up --entities "$LABEL" > /tmp/45d.json
          python3 "$S/schema_extract.py" /tmp/up --constants "$LABEL" > /tmp/45e.json
          python3 "$S/schema_extract.py" /tmp/up --procedures "$LABEL" > /tmp/45f.json
          python3 "$S/schema_extract.py" /tmp/up --checks "$LABEL" > /tmp/45g.json

      - name: Run mechanical adoption gates
        run: |
          set -euo pipefail
          S=skills/building-tnr-content/scripts
          D=skills/building-tnr-content/data
          python3 "$S/schema_diff.py" --invariants /tmp/45c.json --constants /tmp/45e.json
          python3 "$S/schema_diff.py" diff "$D/45c_DATA_constructors.json" /tmp/45c.json
          python3 "$S/schema_diff.py" diff "$D/45d_DATA_entity_schemas.json" /tmp/45d.json
          python3 "$S/schema_diff.py" diff "$D/45e_DATA_constants.json" /tmp/45e.json

      - name: Assert unchanged source-family members and 45g law blocks
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = Path('skills/building-tnr-content/data')
          def load(p): return json.loads(Path(p).read_text())
          def strip_prov(v):
              if isinstance(v, dict):
                  return {k: strip_prov(x) for k, x in v.items() if k != '_provenance'}
              if isinstance(v, list): return [strip_prov(x) for x in v]
              return v

          current_c = load(data / '45c_DATA_constructors.json')
          candidate_c = load('/tmp/45c.json')
          if strip_prov(current_c) != strip_prov(candidate_c):
              raise SystemExit('45c payload differs from the pinned-source candidate')

          current_g = load(data / '45g_DATA_checks.json')
          candidate_g = load('/tmp/45g.json')
          current_law = {k:v for k,v in current_g.items() if isinstance(v, dict) and v.get('_class') == 'law'}
          candidate_law = {k:v for k,v in candidate_g.items() if isinstance(v, dict) and v.get('_class') == 'law'}
          if current_law != candidate_law:
              raise SystemExit('45g hand-held law blocks changed during regeneration')

          # 45e/45f already claim this source. Do not adopt regenerated copies here;
          # require their contract bodies to remain equivalent apart from known
          # hand-carried metadata/caveat text.
          current_f = load(data / '45f_DATA_procedures.json')
          candidate_f = load('/tmp/45f.json')
          if strip_prov(current_f) != strip_prov(candidate_f):
              raise SystemExit('45f payload differs from the pinned-source candidate')
          print('45c payload stable; 45f payload stable; 45g law blocks stable')
          PY

      - name: Print bounded semantic diff for 45d and 45g
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          def walk(a, b, path='$'):
              if type(a) is not type(b):
                  yield path, a, b; return
              if isinstance(a, dict):
                  for k in sorted(set(a) | set(b)):
                      if k == '_provenance':
                          continue
                      p = f'{path}.{k}'
                      if k not in a: yield p, '<missing>', b[k]
                      elif k not in b: yield p, a[k], '<missing>'
                      else: yield from walk(a[k], b[k], p)
              elif isinstance(a, list):
                  if a != b: yield path, a, b
              elif a != b:
                  yield path, a, b

          D = Path('skills/building-tnr-content/data')
          pairs = [
              ('45d', D/'45d_DATA_entity_schemas.json', Path('/tmp/45d.json')),
              ('45g', D/'45g_DATA_checks.json', Path('/tmp/45g.json')),
          ]
          for label, oldp, newp in pairs:
              old, new = json.loads(oldp.read_text()), json.loads(newp.read_text())
              diffs = list(walk(old, new))
              print(f'== {label}: {len(diffs)} semantic difference(s), excluding _provenance ==')
              for path, before, after in diffs[:160]:
                  def short(v):
                      s = repr(v)
                      return s if len(s) <= 220 else s[:217] + '...'
                  print(path)
                  print('  OLD', short(before))
                  print('  NEW', short(after))
              if len(diffs) > 160:
                  print(f'... {len(diffs)-160} more difference(s)')
          PY
