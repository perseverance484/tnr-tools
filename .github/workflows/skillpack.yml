name: skillpack
on:
  push:
    paths: ["skills/**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: skillpack
  cancel-in-progress: true
jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip skills (SKILL.md at zip root)
        run: |
          mkdir -p dist
          for d in skills/*/; do
            n=$(basename "$d")
            rm -f "dist/${n}.zip"
            (cd "$d" && zip -rq "../../dist/${n}.zip" .)
          done
          ls -la dist/
      - name: Sync builder root config from skill data
        run: |
          cp skills/building-tnr-content/data/45c_DATA_constructors.json .
          cp skills/building-tnr-content/data/45g_DATA_checks.json .
          cp skills/building-tnr-content/data/32b_DATA_pool.json .
      - name: Commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "skillpack: rebuild dist + sync root config [auto]"
          file_pattern: "dist/* 45c_DATA_constructors.json 45g_DATA_checks.json 32b_DATA_pool.json"
