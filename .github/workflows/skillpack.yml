name: skillpack
on:
  push:
    paths:
      - "skills/**"
      - ".github/scripts/pack_skills.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: skillpack-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check doctrine
        run: |
          python3 skills/building-tnr-content/scripts/doctrinemap.py
          python3 skills/building-tnr-content/scripts/render_doctrine.py --check
          python3 skills/building-tnr-content/scripts/build_packs.py --check
      - name: Build deterministic skill ZIPs
        run: |
          python3 .github/scripts/pack_skills.py
          sha256sum dist/*.zip > /tmp/skillpack.sha256
          python3 .github/scripts/pack_skills.py
          sha256sum -c /tmp/skillpack.sha256
      - name: Sync builder contracts
        run: |
          cp skills/building-tnr-content/data/45c_DATA_constructors.json .
          cp skills/building-tnr-content/data/45g_DATA_checks.json .
          cp skills/building-tnr-content/data/32b_DATA_pool.json .
      - name: Commit generated files
        run: >-
          python3 .github/scripts/commit_generated.py
          "skillpack: rebuild dist + sync root config [auto]"
          "dist/*"
          45c_DATA_constructors.json
          45g_DATA_checks.json
          32b_DATA_pool.json
