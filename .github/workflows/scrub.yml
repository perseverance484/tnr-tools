name: scrub
on: [push]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check configured private strings
        env:
          SCRUB_STRINGS: ${{ secrets.SCRUB_STRINGS }}
        run: |
          if [ -z "$SCRUB_STRINGS" ]; then
            echo "::error::SCRUB_STRINGS is empty"
            exit 1
          fi

          hit=0
          count=0
          while IFS= read -r pattern; do
            [ -z "$pattern" ] && continue
            count=$((count + 1))
            if grep -rIq --exclude-dir=.git -F -- "$pattern" .; then
              echo "::error::Configured private string found in:"
              grep -rIl --exclude-dir=.git -F -- "$pattern" .
              hit=1
            fi
          done <<< "$SCRUB_STRINGS"

          [ "$count" -gt 0 ] || { echo "::error::SCRUB_STRINGS has no patterns"; exit 1; }
          [ "$hit" -eq 0 ] || exit 1
          echo "scrub clean ($count patterns)"
