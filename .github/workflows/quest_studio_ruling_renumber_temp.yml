name: quest-studio-ruling-renumber-temp

on:
  push:
    paths:
      - ".github/workflows/quest_studio_ruling_renumber_temp.yml"

permissions:
  contents: write

jobs:
  renumber:
    if: github.ref == 'refs/heads/chatgpt/forge-quest-studio-source-push-work'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/forge-quest-studio-source-push-work
          fetch-depth: 0
      - name: Renumber ruling after main collision
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          paths = [
              Path('docs/RULINGS.md'),
              Path('docs/design/FORGE_NEXT_REPO_BACKED_STUDIO_ARCHITECTURE.md'),
          ]
          old = 'RUL-2026-09-16-001'
          new = 'RUL-2026-09-16-002'
          total = 0
          for path in paths:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one {old}, found {count}')
              path.write_text(text.replace(old, new), encoding='utf-8')
              total += count
          print(f'renumbered {total} references')
          PY
          git diff --check -- docs/RULINGS.md docs/design/FORGE_NEXT_REPO_BACKED_STUDIO_ARCHITECTURE.md
      - name: Commit renumbering
        run: |
          set -euo pipefail
          git config user.name "quest-studio-source-push[bot]"
          git config user.email "quest-studio-source-push[bot]@users.noreply.github.com"
          git add -- docs/RULINGS.md docs/design/FORGE_NEXT_REPO_BACKED_STUDIO_ARCHITECTURE.md
          git commit -m "docs: renumber source-push ruling after main collision"
          git push origin HEAD:chatgpt/forge-quest-studio-source-push-work
