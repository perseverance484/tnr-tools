name: answers
on:
  push:
    paths:
      - "harvests/**"
      - ".github/scripts/build_answers.py"
      - ".github/workflows/answers.yml"
      - "skills/building-tnr-content/scripts/record_index.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: answers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 .github/scripts/build_answers.py --repo . --out answers
      - name: Verify evidence selection and read-only query behavior before publication
        run: python3 -m unittest scripts/test_record_index.py scripts/test_repo_tasks.py
      - run: >-
          python3 .github/scripts/commit_generated.py
          "answers: regenerate [auto]"
          "answers/*"
