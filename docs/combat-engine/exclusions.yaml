# Exclusion list for new tag proposals (the director's rule, Nov 22 2026:
# "Please analyze all pre-existing tags and create exclusions for them and their effects to avoid overlap").
# A proposal is rejected if its core effect does what an area below already owns,
# even with different numbers, a different trigger or a different target.
# Changing WHEN or HOW MUCH doesn't make it new. It has to do something no row does.
# Check a proposal against: this file, interactions.json (kind: overlaps), and each nearby tag's file in tags/.
pinned_game_commit: 29cd91b5ebda9c319eb72e80670229b0b72ea9ac
areas:
  - area: Damage now
    tags: [damage, pierce, elementaldamage, onehitkill, weakness]
    owns: deals damage, ignores defences, kills outright, or adds damage against something
  - area: Damage later
    tags: [wound, afterburn, poison, drain, diffuse, curse]
    owns: deals or takes damage over time, or stores damage or healing to land later
  - area: Damage scaling
    tags: [increasedamagegiven, decreasedamagegiven, increasedamagetaken, decreasedamagetaken, increasepotency, decreasepotency, increasestat, decreasestat, increasemastery, decreasemastery]
    owns: raises or lowers how hard someone hits or gets hit, through percentage or flat damage given/taken modifiers, the stats the damage formula reads (offence, defence and the matching generals), or jutsu potency. It also holds the mastery tags, which change mastery values and so can open or close jutsu and items gated on mastery (actions.ts:242, 293); mastery is not a damage-formula input. These are the modifiers the engine implements; none caps a hit or flips damage into healing (reductions stop at 0 and at the 10% floor, engine.md 4).
  - area: Soak damage
    tags: [shield, barrier, absorb, siphon, consume, finalstand]
    owns: soaks incoming damage in a separate HP bar (shield, barrier), turns damage dealt or taken into shields or pools (siphon, consume, absorb), or stops a packet at 1 HP while active (finalstand). Percentage and flat damage reduction belong to Damage scaling.
    engine_note: finalstand is a conditional per-packet floor at 1 HP, not a per-hit ceiling; DR is multipliers, a flat subtraction and a 10% minimum-damage floor (engine.md 4, 4a). A generic per-hit damage cap is not implemented by any tag, but the director ruled it out as overlap (past_proposals Bulwark).
  - area: Send it back
    tags: [reflect, parry, recoil, mirror]
    owns: returns damage to the attacker, makes someone hurt themselves, or passes your debuffs to them
  - area: Healing
    tags: [heal, lifesteal, vamp, increaseheal, decreaseheal, healprevent]
    owns: heals, heals off damage, or changes or blocks healing
  - area: Remove effects
    tags: [clear, cleanse]
    owns: takes positive or negative effects off, in whole or in part
  - area: Take effects
    tags: [copy]
    owns: copies the enemy's positive effects to you (copy). Copy leaves the original on the enemy; no tag moves or steals a buff off them.
    engine_note: moving a buff, or taking the enemy's next buff, is not implemented, but the director ruled a next-buff redirect out as overlap with copy (past_proposals Hijack).
  - area: Protection
    tags: [buffprevent, debuffprevent, clearprevent, cleanseprevent, stunprevent, sealprevent, summonprevent, onehitkillprevent, robprevent, immunity]
    owns: stops an effect from landing, or protects an effect from removal
  - area: Deny actions
    tags: [stun, seal, elementalseal, stealth, disarm, timecompression, increasepoolcost, increasecooldown]
    owns: takes AP away, raises costs, raises basic-action cooldowns, or locks jutsu, bloodlines, elements or weapons
    engine_note: increasecooldown touches basic actions only (actions.ts:458-485).
  - area: Speed up actions
    tags: [timedilation, decreasepoolcost, decreasecooldown, injectjutsus, increaserange]
    owns: lowers AP or pool costs (timedilation, decreasepoolcost), lowers basic-action cooldowns (decreasecooldown), adds jutsu (injectjutsus), or extends basic-action range (increaserange)
    engine_note: decreasecooldown and increaserange touch basic actions only, never jutsu (actions.ts:434-488). Jutsu cooldown timing is open space below.
  - area: Position
    tags: [move, moveprevent, redirection]
    owns: moves anyone, pulls or pushes, or stops or limits movement
  - area: Extra fighters
    tags: [summon, clone]
    owns: adds a body to the fight
  - area: Pools and money
    tags: [increasemaxpools, decreasemaxpools, rob]
    owns: changes max HP, chakra or stamina, or takes ryo
  - area: Escape
    tags: [flee, fleeprevent]
    owns: leaves the fight or stops someone leaving
  - area: Enemy AI focus (PvE)
    tags: [increaseaggro, decreaseaggro]
    owns: changes who AI enemies target
  - area: Sage mode
    tags: [activatesagemode]
    owns: enters sage mode
outside_battle_or_cosmetic: [increaseregeneration, decreasecookingtime, decreasecraftingtime, decreasefarmingtime, decreasegatheringtime, increasegatheringyield, increasehuntingyield, increasejutsuslots, marriageslotincrease, noncombatincreasereskins, noncombatconsumereward, noncombatgainskill, noncombatquest, repair, removebloodline, rollbloodline, rollsagemode, unlockitemvariant, unknown, visual]
open_space:   # outcomes no existing tag owns
  - name: Duration
    detail: adjusting the rounds of an effect that stays on, lengthening or shortening it. Ending an effect is owned elsewhere - Clear and Cleanse set the removed effects' rounds to 0 (tags.ts:1104-1127), Pierce zeros the shields it destroys (process.ts:1004-1016), and a blocked prevent check ends an effect - but no tag adjusts a surviving effect's rounds. The one rounds reset in the engine is a bloodline Final Stand re-arming itself to 1 round when it fires (tags.ts:2220-2221), which is not a duration tool.
  - name: Turn order
    detail: who acts first in a round. Initiative exists in the engine (cyclic order), but no tag changes it.
  - name: Information
    detail: hiding your own effects or revealing the enemy's loadout. Stealth locks the holder's jutsu and stops other fighters' non-ground effects landing on them; it hides nothing.
  - name: Jutsu cooldown timing
    detail: the cooldown tags only touch basic actions. Making a used jutsu ready sooner, or delaying an enemy's jutsu cooldown, is open. Locking a jutsu outright is Deny actions.
  - name: Triggers on the enemy's choice
    detail: no tag fires on an enemy's specific choice of jutsu, target or action type. Two tags already react to enemy behaviour and own those triggers - poison (the holder spends chakra or stamina, tags.ts:2161-2169) and afterburn (the holder takes a direct hit, tags.ts:1888-1912) - as do the hit readers (reflect, recoil, absorb, lifesteal). A trigger on a specific choice is open; whatever it does when it fires still has to pass this list.
