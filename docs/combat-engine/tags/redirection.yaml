tag: redirection
schema: validators/combat.ts RedirectionTag (line 506)
exclusion_area: Position
in_game_text: Redirects the target towards or away from the user by power number of spaces
behavior: "Instant only (rounds 0). It pulls the target toward the caster, stopping next to them, or pushes it away, by power hexes along the line. The landing is clamped to the board. Only the landing tile is checked: if a player, the caster or a barrier (any ground object with HP) is there, the target steps back toward its start to the first open tile, or stays put. Players and barriers in between are crossed. A moveprevent from an earlier round blocks it."
polarity: negative   # positive = Clear removes; negative = Cleanse removes; neutral = neither
prevented_by: [moveprevent]
prevent_check: "age-compared: blocks only effects created in a later round than the prevent (tags.ts:2561)"
copy_can_take: false
mirror_can_pass: true
potency_eligible: false
immunity_can_cancel: false
stage: S3 main pass
calculation: [static]   # default static
own_fields:   # zod expressions resolved from the schema (helpers, spreads, extend); fields inherited unchanged from BaseAttributes/PowerAttributes are in engine.md section 6
  rounds: z.coerce.number().int().min(0).max(0).prefault(0)
  direction: "z.enum([\"push\", \"pull\"]).prefault(\"pull\")"
  calculation: "z.enum([\"static\"]).prefault(\"static\")"
  generalTypes: z.array(z.enum(GeneralTypes)).optional()   # from IncludeGeneralsAndElements
  elements: z.array(z.enum(ElementNames)).optional()   # from IncludeGeneralsAndElements
live_usage_2026_11_21: {jutsu: 9, pvp_legal: 9}
