tag: shield
schema: validators/combat.ts ShieldTag (line 762)
exclusion_area: Soak damage
in_game_text: Creates a temporary HP bar that lasts for a set amount of rounds
behavior: "Rolls power% to appear, then becomes a separate HP bar worth its health field. Incoming damage drains shields before HP, except pierce (which destroys them), reflect and wound (which skip them). It's positive, so Clear removes it and Copy can take it."
polarity: positive   # positive = Clear removes; negative = Cleanse removes; neutral = neither
prevented_by: []   # no prevent check in its handler
copy_can_take: true
mirror_can_pass: false
potency_eligible: true
immunity_can_cancel: false
stage: A4 mid-modifiers
calculation: [static]
own_fields:   # zod expressions copied from the schema; base fields are in engine.md section 6
  rounds: z.coerce.number().int().min(1).max(100).prefault(3)
  health: z.coerce.number().int().min(1).max(SHIELD_MAX_HEALTH).prefault(100)
