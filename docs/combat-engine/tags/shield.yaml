tag: shield
schema: validators/combat.ts ShieldTag (line 762)
exclusion_area: Soak damage
in_game_text: Creates a temporary HP bar that lasts for a set amount of rounds
behavior: "Rolls power% to appear, then acts as a separate HP bar worth its health field (up to 100,000). Direct, residual and parry-return damage drain the holder's shields before HP, as does the immediate part of anything Diffuse deferred. Pierce isn't soaked: it sets every enabled shield on the target to 0. When the target's Diffuse deferred part of it, the immediate part is soaked instead, and the shields are still destroyed only if positive Reflect remains on that Pierce hit when mitigation runs. Afterburn, drain, poison, One Hit Kill and Diffuse repayment never touch shields. Wound skips them only when it arrives on its own rather than merged into another hit from the same caster. Quirk (likely a game bug): reflect and recoil damage are soaked by the shields of the other side of the original hit, not the shields of the player taking it. It's positive, so Clear removes it and Copy can take it."
polarity: positive   # positive = Clear removes; negative = Cleanse removes; neutral = neither
prevented_by: []   # no prevent check in its handler
copy_can_take: true
mirror_can_pass: false
potency_eligible: true
immunity_can_cancel: false
stage: S3 main pass (land roll); soaks in S15
calculation: [static]   # default static
own_fields:   # zod expressions resolved from the schema (helpers, spreads, extend); fields inherited unchanged from BaseAttributes/PowerAttributes are in engine.md section 6
