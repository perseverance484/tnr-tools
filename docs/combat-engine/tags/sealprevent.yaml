exclusion_area: Protection
in_game_text: Prevents bloodline from being sealed
behavior: "A prevent-type status that rolls power% once to land. While active, it blocks any Seal on the holder regardless of when the Seal was cast. Seal re-checks on each of the holder's turns, so a Sealprevent that lands after a Seal ends that Seal at the holder's next turn. A bloodline-sourced Sealprevent is itself switched off while a Seal is active. Clear removes it, and Immunity can cancel a new one."
