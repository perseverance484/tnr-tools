tag: afterburn
schema: validators/combat.ts AfterburnTag (line 871)
exclusion_area: Damage later
in_game_text: Take a percentage of incoming damage as afterburndamage
behavior: "A debuff on the holder, live from the round after it lands, with no prevent check. For each instant non-Pierce hit the holder takes whose generals match (elements ignored), each Afterburn adds floor(hit x power/100), or floor(min(power, hit)) if static. The running total for that hit is clamped to floor(0.6 x hit), using the hit after the pipeline and Parry, before Diffuse. Diffuse can defer part of it. Otherwise it lands on the holder after Reflect and Recoil with no further cap, and neither shields nor Final Stand stop it. Afterburn from several hits in one action is summed, each hit under its own cap."
polarity: negative   # positive = Clear removes; negative = Cleanse removes; neutral = neither
