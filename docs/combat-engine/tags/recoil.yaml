tag: recoil
schema: validators/combat.ts RecoilTag (line 862)
exclusion_area: Send it back
in_game_text: Recoil damage given back to self
behavior: "A debuff on the attacker, live from the round after it lands. For each instant non-Pierce hit the holder deals, each Recoil sets (does not add) that hit's recoil to floor(hit x power/100), or floor(min(power, hit)) if static, times the generals match. The last Recoil in resolution order wins, and one whose generals don't match writes 0. There is no 60% or other cap. Quirk (likely a game bug): the amount is soaked by the shields of the player the holder hit, then the holder's Final Stand applies; it is applied after Reflect and summed across hits. A debuffprevent from an earlier round blocks it."
polarity: negative   # positive = Clear removes; negative = Cleanse removes; neutral = neither
prevented_by: [debuffprevent]
prevent_check: "age-compared: blocks only effects created in a later round than the prevent"
copy_can_take: false
mirror_can_pass: true
potency_eligible: false
immunity_can_cancel: false
stage: S10 post-damage readers; applied in S15
live_from: next round (waits while isNew/castThisRound)
calculation: [static, percentage]   # default percentage
