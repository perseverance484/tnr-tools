tag: damage
schema: validators/combat.ts DamageTag (line 635)
exclusion_area: Damage now
in_game_text: Deals damage to target
behavior: "Formula damage (the default) scales a baseline by power and by an attack-vs-defence advantage. The baseline is max HP at the attacker's level divided by base hits. Attack and defence are the square roots of the caster's Offence and the target's Defence plus double-weighted lower generals, with negatives treated as 0. The advantage is 1 when both sides are 0 and is otherwise clamped between 0.01 and 10. Static and percentage damage use effective power as a flat number, and percentage power is capped at 100. A non-zero dmgModifier, the highest-power matching Weakness and, on later-round ticks, a non-zero residualModifier multiply the number. An instant hit through a barrier loses the barrier's share. It then runs the damage pipeline: the attacker's Curse bonus, increases, the 50% system reduction and other reductions, a floor at 10% of the post-system hit, static modifiers, keystones, and finally bloodline modifiers, subject to Seal and the allowBloodline opt-outs. With rounds 0 it hits on cast. With rounds above 0 the casting action deals nothing; it then ticks as residual damage (x residualModifier, no barrier cut) once per round on the holder's first action of each later round. A round in which the holder doesn't act gives no tick."
polarity: negative   # positive = Clear removes; negative = Cleanse removes; neutral = neither
prevented_by: []   # no prevent check in its handler
copy_can_take: false
mirror_can_pass: false
potency_eligible: true
immunity_can_cancel: false
stage: "S3 main pass (raw written) -> S7 damage pipeline -> S15 mitigate and apply"
live_from: "rounds 0: casting action; rounds > 0: holder's first action in the round after cast, then once per round"
applies: "rounds 0: once, on cast; rounds > 0: nothing on cast, then once a round on the holder's first action"
calculation: [formula, static, percentage]   # default formula
own_fields:   # zod expressions resolved from the schema (helpers, spreads, extend); fields inherited unchanged from BaseAttributes/PowerAttributes are in engine.md section 6
  calculation: "z.enum([\"formula\", \"static\", \"percentage\"]).prefault(\"formula\")"
  generalTypes: z.array(z.enum(GeneralTypes)).optional()   # from IncludeGeneralsAndElements
  elements: z.array(z.enum(ElementNames)).optional()   # from IncludeGeneralsAndElements
  residualModifier: z.coerce.number().min(0).max(2).prefault(1).optional()
  dmgModifier: z.coerce.number().min(0).max(2).prefault(1).optional()
  allowBloodlineDamageIncrease: z.coerce.boolean().prefault(true)
  allowBloodlineDamageDecrease: z.coerce.boolean().prefault(true)
