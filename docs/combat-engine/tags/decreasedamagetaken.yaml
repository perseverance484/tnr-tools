tag: decreasedamagetaken
schema: validators/combat.ts DecreaseDamageTakenTag (line 396)
exclusion_area: Damage scaling
in_game_text: Decrease damage taken of target
behavior: "Reduces Damage and Elemental Damage packets the holder takes. It doesn't touch Pierce, drain, poison, wound, afterburn or Diffuse repayment. It works from the round after it lands, and Buffprevent can block it. Each percentage effect multiplies by (1 - power%), clamped at 0, after all increases and the 50% system reduction. Percentages are percentage points, divided by 100 like increases. Pre-battle percentages sit in two pools: gear DR points join the 50 system points, before static values; keystone DR points are summed into a separate multiplier applied after static values, and skipped when DR is ignored (the Diffuse lethality test). Static values are subtracted after the ordinary percentage stage. Bloodline percentages apply last; Seal and the damage tag's allowBloodlineDamageDecrease opt-out can switch bloodline ones off. With elements set, it only affects packets that share an element, and packets without elements count as None. Damage never drops below 10% of the boosted hit after the system reduction."
polarity: positive   # positive = Clear removes; negative = Cleanse removes; neutral = neither
prevented_by: [buffprevent]
prevent_check: "age-compared: blocks only effects created in a later round than the prevent"
copy_can_take: true
mirror_can_pass: false
potency_eligible: true
immunity_can_cancel: false
