tag: lifesteal
schema: validators/combat.ts LifeStealTag (line 695)
exclusion_area: Healing
in_game_text: Heal based on damage given
behavior: "A buff on the attacker, live from the round after it lands. For each instant hit the holder deals, Pierce included, it stores floor(hit x power/100), percentage only. The hit is taken after the pipeline and the Parry split, before Diffuse and shields. If lifesteal has generals, they must overlap the damage tag's generals ('Highest' expands), but Pierce always passes and elements are never checked. Diffuse scales the stored amount to the immediate part, and the attacker's heal modifiers scale it, unrounded. It pays min(stored, floor(0.6 x pre-shield immediate damage) - Vamp already paid). It pays only if the target is still alive after the whole packet (damage, reflect, recoil, afterburn), the attacker is alive and the attacker holds no unsettled Curse. Residual ticks don't feed it, and a healprevent from an earlier round blocks it. Copy can take it."
polarity: positive   # positive = Clear removes; negative = Cleanse removes; neutral = neither
prevented_by: [healprevent]
prevent_check: "age-compared: blocks only effects created in a later round than the prevent"
copy_can_take: true
mirror_can_pass: false
potency_eligible: true
immunity_can_cancel: false
stage: S10 post-damage readers; paid in S15
live_from: next round (waits while isNew/castThisRound)
calculation: [percentage]   # default percentage
own_fields:   # zod expressions resolved from the schema (helpers, spreads, extend); fields inherited unchanged from BaseAttributes/PowerAttributes are in engine.md section 6
  calculation: "z.enum([\"percentage\"]).prefault(\"percentage\")"
  generalTypes: z.array(z.enum(GeneralTypes)).optional()   # from IncludeGeneralsAndElements
  elements: z.array(z.enum(ElementNames)).optional()   # from IncludeGeneralsAndElements
live_usage_2026_11_21: {jutsu: 40, pvp_legal: 38}
