tag: finalstand
schema: validators/combat.ts FinalStandTag (line 772)
exclusion_area: Soak damage
in_game_text: User cannot be reduced below 1 HP
behavior: "Rolls power% on each eligible resolution and the first failed roll sets its rounds to 0 and ends it (tags.ts:2238-2255). A finite one rolls on its casting action, on every other fighter's action and on its holder's first action of each round, and skips its holder's later actions in a round (util.ts:856-876). One with no rounds rolls on every resolution, and a failed roll ends it for the fight. While active, each separate damage packet that would leave the holder below 1 HP is cut to leave exactly 1 HP. Each packet is checked against HP as it stood before the action's damage, so several packets that are each survivable can still kill together (two 60s on a 100-HP holder kill). It applies to direct, residual, Pierce, wound, parry return, reflect and recoil damage, to the immediate part of deferred damage and to Diffuse repayment. It does not apply to ordinary afterburn, drain, poison or One Hit Kill. A bloodline version needs to be active and unsealed, and re-arms for one round when it fires. Neither Clear nor Cleanse removes it."
polarity: neutral   # positive = Clear removes; negative = Cleanse removes; neutral = neither
prevented_by: []   # no prevent check in its handler
copy_can_take: false
mirror_can_pass: false
potency_eligible: false
immunity_can_cancel: false
