tag: finalstand
schema: validators/combat.ts FinalStandTag (line 772)
exclusion_area: Soak damage
in_game_text: User cannot be reduced below 1 HP
behavior: "Rolls power% to activate. While active, each separate damage packet that would leave the holder below 1 HP is cut to leave exactly 1 HP. Each packet is checked against HP as it stood before the action's damage, so several packets that are each survivable can still kill together (two 60s on a 100-HP holder kill). It applies to direct, residual, Pierce, wound, parry return, reflect and recoil damage, to the immediate part of deferred damage and to Diffuse repayment. It does not apply to ordinary afterburn, drain, poison or One Hit Kill. A bloodline version needs to be active and unsealed, and re-arms for one round when it fires. Neither Clear nor Cleanse removes it."
polarity: neutral   # positive = Clear removes; negative = Cleanse removes; neutral = neither
