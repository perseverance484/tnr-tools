tag: summon
schema: validators/combat.ts SummonTag (line 996)
exclusion_area: Extra fighters
in_game_text: "Summon an ally for a certain number of rounds. Its stats are scaled to same total as the summoner, modified by the power of the jutsu as a percentage."
behavior: "Spawns the chosen AI on the target tile, or on the nearest empty tile if that one is taken, with aiHp HP and stats scaled to power% of the summoner's total. It acts as a separate fighter. It copies the summoner's initiative and is inserted into the turn order right after the summoner and anyone tied with them. It can be player-piloted and leaves when its rounds end. Summonprevent hides summon jutsu."
polarity: positive   # positive = Clear removes; negative = Cleanse removes; neutral = neither
prevented_by: [summonprevent]
prevent_check: "action gate only: summonprevent hides summon jutsu (actions.ts:231-237); no handler check"
copy_can_take: false
mirror_can_pass: false
potency_eligible: false
immunity_can_cancel: false
stage: S1 ground pass
calculation: [percentage]   # default percentage
own_fields:   # zod expressions resolved from the schema (helpers, spreads, extend); fields inherited unchanged from BaseAttributes/PowerAttributes are in engine.md section 6
  rounds: z.coerce.number().int().min(2).max(100).prefault(2)
  calculation: "z.enum([\"percentage\"]).prefault(\"percentage\")"
  aiId: "z.string().prefault(\"\")"
  aiHp: z.coerce.number().min(100).max(100000).prefault(100)
  playerControlled: z.boolean().prefault(false)
live_usage_2026_11_21: {jutsu: 22, pvp_legal: 22}
