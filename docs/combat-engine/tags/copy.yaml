tag: copy
schema: validators/combat.ts CopyTag (line 654)
exclusion_area: Take effects
in_game_text: Copies some positive effects from the target to the user
behavior: "The caster's own buffprevent can block it. Otherwise it rolls power% to clone the target's best positive effects onto the caster for the copy's rounds; the target keeps theirs. It holds 4 at most at once, per caster. Order of preference: damage-given up or damage-taken down, then lifesteal, then absorb or reflect, then shield, then increaseheal, then increasestat. Passive and gear sources can't be copied."
polarity: neutral   # positive = Clear removes; negative = Cleanse removes; neutral = neither
prevented_by: [buffprevent (on the caster)]
copy_can_take: false
mirror_can_pass: false
potency_eligible: false
immunity_can_cancel: false
stage: A1 copy and mirror (run first)
calculation: [percentage]
own_fields:   # zod expressions copied from the schema; base fields are in engine.md section 6
  calculation: "z.enum([\"percentage\"]).prefault(\"percentage\")"
  rounds: z.coerce.number().int().min(1).max(10).prefault(3)
live_usage_2026_11_21: {jutsu: 4, pvp_legal: 4}
