tag: summonprevent
schema: validators/combat.ts SummonPreventTag (line 994)
exclusion_area: Protection
in_game_text: Prevents summoning
behavior: "A prevent-type status that rolls power% once to land. While it is active with rounds left (and not cast this round), jutsu with a summon tag are removed from the holder's action list, and the server enforces this. The summon handler never checks it, so summons already on the field stay, and items with a summon tag are not filtered. Cleanse removes it, Mirror can pass it, and Immunity can cancel a new one."
polarity: negative   # positive = Clear removes; negative = Cleanse removes; neutral = neither
prevented_by: []   # no prevent check in its handler
copy_can_take: false
mirror_can_pass: true
potency_eligible: false
immunity_can_cancel: true
stage: S3 main pass; action gate in availableUserActions
live_from: action gate while active with rounds left and not cast this round
calculation: [static]   # default static
fields_note: simpleTag (BaseAttributes + PowerAttributes only)
live_usage_2026_11_21: {jutsu: 1, pvp_legal: 1}
