tag: mirror
schema: validators/combat.ts MirrorTag (line 663)
exclusion_area: Send it back
in_game_text: Mirrors some negative effects from the user to the target
behavior: "Rolls power% to clone up to 4 of the caster's own active negative effects onto the target for the mirror's rounds. The caster keeps their copies. Order of preference: damage-taken up or damage-given down first, then afterburn, then poison or pool-cost, then wound, then anything else. Raw damage, pierce, clear, stun, time compression and four prevents are excluded, and so is anything from bloodline, gear or other passives. The target's debuffprevent blocks it."
polarity: neutral   # positive = Clear removes; negative = Cleanse removes; neutral = neither
prevented_by: [debuffprevent]
copy_can_take: false
mirror_can_pass: false
potency_eligible: false
immunity_can_cancel: false
stage: A1 copy and mirror (run first)
calculation: [percentage]
own_fields:   # zod expressions copied from the schema; base fields are in engine.md section 6
  calculation: "z.enum([\"percentage\"]).prefault(\"percentage\")"
  rounds: z.coerce.number().int().min(1).max(10).prefault(3)
live_usage_2026_11_21: {jutsu: 4, pvp_legal: 4}
