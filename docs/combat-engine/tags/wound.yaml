tag: wound
schema: validators/combat.ts WoundTag (line 826)
exclusion_area: Damage later
in_game_text: Applies wound damage over multiple turns based on damage dealt
behavior: "When cast, it records the damage its caster dealt to the target in that action (instant Pierce included). Each later round it deals power% of that recorded hit again. Ticking in its own consequence, that damage skips shields but not Final Stand; merged into another consequence from the same caster (a residual tick, drain or poison), it is soaked by shields like that host, and destroys them if the host is Pierce. It's mirror-eligible."
