tag: drain
schema: validators/combat.ts DrainTag (line 740)
exclusion_area: Damage later
in_game_text: "Drain target's pools over time"
behavior: "Each round it removes a flat amount, or power% of the max, from the chosen pools (HP, chakra, stamina). It writes its consequence in the main pass, despite its post-pierce sort rank, and the HP part skips shields and Final Stand except on the Diffuse path. Debuffprevent from an earlier round blocks it. When mirrored, its power is divided by the mirror's rounds."
polarity: negative   # positive = Clear removes; negative = Cleanse removes; neutral = neither
prevented_by: [debuffprevent]
prevent_check: "age-compared: blocks only effects created in a later round than the prevent"
copy_can_take: false
mirror_can_pass: true
potency_eligible: true
immunity_can_cancel: false
stage: S3 main pass (writes the consequence despite its post-pierce rank); applied in S15
applies: "on its casting action, then on the holder's first action of each later round (not again in the cast round; no-rounds versions: every holder action)"
