name: rc335-uploadthing
# One-off: upload the five Sector 335 resource cache icons to the director's own UploadThing app.
# Runs only on the claude/project-thread-ua0lgy branch. Results are committed back to that branch.
on:
  push:
    branches: [claude/project-thread-ua0lgy]
    paths: ["state/rc335_upload/upload_list.json", "state/rc335_upload/run.txt", ".github/scripts/ut_upload_rc335.mjs", ".github/workflows/rc335_upload.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: rc335-uploadthing, cancel-in-progress: false }
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { lfs: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Gate (runs only when state/rc335_upload/run.txt says go)
        id: gate
        run: grep -qx "go" state/rc335_upload/run.txt && echo "go=1" >> "$GITHUB_OUTPUT" || echo "run.txt is not go; nothing uploaded"
      - if: steps.gate.outputs.go == '1'
        run: npm install --no-save --no-package-lock uploadthing@7
        working-directory: /tmp
      - name: Upload
        if: steps.gate.outputs.go == '1'
        env:
          UPLOADTHING_TOKEN: ${{ secrets.UPLOADTHING_TOKEN }}
          NODE_PATH: /tmp/node_modules
        run: |
          ln -s /tmp/node_modules node_modules
          node .github/scripts/ut_upload_rc335.mjs
      - name: Commit results
        if: always() && steps.gate.outputs.go == '1'
        run: |
          rm -f node_modules
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          git add state/rc335_upload/uploaded.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "rc335 upload: results [skip ci]"
          git push origin HEAD:claude/project-thread-ua0lgy || true
