# STAGED WORKFLOW - install at .github/workflows/relay.yml (Wave 4 batch)
# TNR-05 (CWE-78) fixed and INSTALLED 2026-09-03 (4adb505): the dispatch input was
# interpolated into the run block three times; it is now bound to $BRANCH, shape-
# checked, and the merge target is explicit. The workflow logic is IDENTICAL to what
# is installed; the two files differ only in these three comment lines, because the
# container PAT cannot push .github/workflows/ to correct a comment. Not a drift.
# ---------------------------------------------------------------------------
# Ruling 4 (approved): moves privileged main-writes off the long-lived pasted
# PAT. Flow AFTER install + ritual switch: the container pushes to a work
# branch (relay/<topic>) with a branch-scoped PAT, then dauntless triggers
# this dispatch (or the container calls it if the PAT gains actions:write on
# this repo only); the merge to main runs under GitHub's auto-minted,
# auto-expiring GITHUB_TOKEN. Until the ritual switches, the container keeps
# pushing main directly - installing this is safe and inert.
# ---------------------------------------------------------------------------
name: relay
on:
  workflow_dispatch:
    inputs:
      branch:
        description: "work branch to merge into main (e.g. relay/wave5)"
        required: true

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge work branch under the expiring token
        env:
          # Bound as data. Never interpolate ${{ }} inside the run block:
          # Actions expands it into the script text before the shell parses it,
          # so a quote in the input escapes into command position (CWE-78).
          BRANCH: ${{ github.event.inputs.branch }}
        run: |
          case "$BRANCH" in
            *[!A-Za-z0-9._/-]*|"") echo "refusing branch name: $BRANCH" >&2; exit 1 ;;
          esac
          git config user.name "relay[bot]"
          git config user.email "relay@users.noreply.github.com"
          git checkout main
          git fetch origin "$BRANCH"
          git merge --no-ff "origin/$BRANCH" \
            -m "relay: merge $BRANCH [auto]"
          git push origin main
