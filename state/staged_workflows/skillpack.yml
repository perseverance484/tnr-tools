# STAGED WORKFLOW - REPLACES .github/workflows/skillpack.yml
# REINSTALL PENDING 2026-09-02: audit TNR-08. Zip step now excludes archive-only
# art and a size guard fails the run if a skill zip exceeds 2MB. Batch 3 will add
# the selfcheck and Pillow gates to this same file - install once, after that.
# ---------------------------------------------------------------------------
# Adds the WO-04 doctrine gates ahead of packaging: doctrinemap.py (every
# [[D-id]] resolves, ids unique) and render_doctrine.py --check (every
# projection - mounted paste, SKILL.md blocks, pipeline.md version line -
# byte-matches docs/DOCTRINE.md). A drifted projection fails the build
# instead of shipping a stale skill zip. Install via web UI in the Wave 4
# batch (with relay.yml and the release-pin workflow); until then the
# container runs both gates in-session.
# ---------------------------------------------------------------------------
name: skillpack
on:
  push:
    paths: ["skills/**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: skillpack
  cancel-in-progress: true
jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Doctrine layer coherent (ids + refs)
        run: python3 skills/building-tnr-content/scripts/doctrinemap.py
      - name: Projections current (fail-closed on drift)
        run: python3 skills/building-tnr-content/scripts/render_doctrine.py --check
      - name: Task packs + TOCs current (fail-closed on drift)
        run: python3 skills/building-tnr-content/scripts/build_packs.py --check
      - name: Zip skills (SKILL.md at zip root)
        run: |
          mkdir -p dist
          for d in skills/*/; do
            n=$(basename "$d")
            rm -f "dist/${n}.zip"
            # Archive-only art is excluded. Banked rank icons and frame plates are
            # outputs of finished waves, not files any skill loads: nothing in
            # SKILL.md, scripts/ or references/ references them. Shipping them made
            # producing-tnr-art.zip 18.4MB and added a fresh blob to history on
            # every skills push. Without them the same zip is 81KB.
            (cd "$d" && zip -rq "../../dist/${n}.zip" . \
              -x 'data/rank_icons/*' -x 'data/frames/*' -x '*_raw.png')
          done
          ls -la dist/
      - name: Guard skill zip size
        run: |
          fail=0
          for z in dist/*.zip; do
            kb=$(( $(stat -c%s "$z") / 1024 ))
            echo "$z ${kb}KB"
            if [ "$kb" -gt 2048 ]; then
              echo "::error::$z is ${kb}KB, over the 2MB ceiling - archive data is leaking back into the skill package"
              fail=1
            fi
          done
          exit $fail
      - name: Sync builder root config from skill data
        run: |
          cp skills/building-tnr-content/data/45c_DATA_constructors.json .
          cp skills/building-tnr-content/data/45g_DATA_checks.json .
          cp skills/building-tnr-content/data/32b_DATA_pool.json .
      - name: Commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "skillpack: rebuild dist + sync root config [auto]"
          file_pattern: "dist/* 45c_DATA_constructors.json 45g_DATA_checks.json 32b_DATA_pool.json"
