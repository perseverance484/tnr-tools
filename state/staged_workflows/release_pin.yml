# STAGED WORKFLOW - install at .github/workflows/release_pin.yml (Wave 4 batch)
# ---------------------------------------------------------------------------
# Ruling 3 (approved, pilot): kills the raw-CDN staleness class. On every push
# that changes builder_bundle.js, rewrite the loader's @require to the
# commit-pinned, permanently-cached jsDelivr URL for THAT sha - a fetched
# loader can then never serve stale builder bytes (new commit = new URL).
# ViolentMonkey's @require cache is still sticky, so a release still needs
# the usual VM refresh; the bytes fetched are then guaranteed correct.
# Pilot shape: single pinned @require; manual fallback = edit the loader back
# to the raw URL. Only tnr-tools code rides the CDN, never game source.
# Paths-filtered so the loader commit this makes cannot retrigger it.
# ---------------------------------------------------------------------------
name: release-pin
on:
  push:
    branches: [main]
    paths: ["builder_bundle.js"]

permissions:
  contents: write

jobs:
  pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pin loader @require to this commit via jsDelivr
        env:
          SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os, re
          sha = os.environ["SHA"]
          url = "https://cdn.jsdelivr.net/gh/perseverance484/tnr-tools@%s/builder_bundle.js" % sha
          p = "builder_loader_user.js"
          s = open(p).read()
          s2, n = re.subn(r"(// @require\s+)\S*builder_bundle\.js\S*",
                          lambda m: m.group(1) + url, s)
          assert n == 1, "expected exactly 1 @require builder_bundle line, got %d" % n
          open(p, "w").write(s2)
          print("pinned ->", url)
          PY
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "loader: pin builder to ${{ github.sha }} via jsDelivr [auto]"
          file_pattern: "builder_loader_user.js"
