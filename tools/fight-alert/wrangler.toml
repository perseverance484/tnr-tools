name = "tnr-fight-alert"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = true

# Wake the watcher every minute so it reconnects after a deploy or an eviction.
[triggers]
crons = ["* * * * *"]

[vars]
# The watched account's public user id (its live channel name) and display name.
WATCH_USER_ID = "user_37qazcrgUPldBPI65bb25DQiCjz"
WATCH_NAME = "dauntless"
# Alert (and swap) on fights the account starts too, not only on fights it is attacked in.
ALERT_OWN_FIGHTS = "true"
# Lobby jutsu swap for every alerted fight (attacked or own): P1 set when dauntless moves
# first, P2 when second. Runs only after the owner signs the Worker in to the game at /auth/start.
SWAP_ENABLED = "true"
P1_LOADOUT_ID = "soXekhNjk7qihu-Rsok-6"
P2_LOADOUT_ID = "ZVfObjuW5xO462WiR5UMQ"
# NTFY_TOPIC is a secret, set with `wrangler secret put NTFY_TOPIC` (the deploy workflow does it).
# Optional overrides: PUSHER_KEY, GAME_ORIGIN, SOKETI_URL, NTFY_URL, MCP_URL.

[[durable_objects.bindings]]
name = "WATCHER"
class_name = "FightWatcher4"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["FightWatcher"]

# v2 replaces the class so a deploy restarts the watcher on the new code (an open outbound
# socket kept the old instance running after the first redeploy).
[[migrations]]
tag = "v2"
renamed_classes = [{ from = "FightWatcher", to = "FightWatcher2" }]

# v3: one more replacement to retire the instance still running the pre-swap code. From
# here on a deploy resets the watcher itself (DEPLOY_ID, see src/index.js).
[[migrations]]
tag = "v3"
renamed_classes = [{ from = "FightWatcher2", to = "FightWatcher3" }]

# v4: the rename in v3 kept the old instance (and its code) running, so start a new class.
# FightWatcher3 is deleted in a later migration, once no binding points at it.
[[migrations]]
tag = "v4"
new_sqlite_classes = ["FightWatcher4"]

# v5: delete the old class, whose instance still ran the pre-swap code (and would send a
# second alert per fight).
[[migrations]]
tag = "v5"
deleted_classes = ["FightWatcher3"]
